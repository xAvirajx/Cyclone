<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cycloneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Protective Resilience Shield Foundation -->
  <path d="M32 4L10 14V30C10 44.5 19.4 56.8 32 60C44.6 56.8 54 44.5 54 30V14L32 4Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Radar Telemetry Pulse Rings -->
  <circle cx="32" cy="32" r="19" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="2 3"/>
  <circle cx="32" cy="32" r="13" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Hydrodynamic Cyclone Spiral Arms -->
  <path d="M32 19C24.5 19 18.5 24.5 18.5 31.5C18.5 40 30 40.5 30 46.5C30 49 28 50.5 25.5 50.5C22.5 50.5 20.5 48.5 20 46" stroke="url(#cycloneGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M32 45C39.5 45 45.5 39.5 45.5 32.5C45.5 24 34 23.5 34 17.5C34 15 36 13.5 38.5 13.5C41.5 13.5 43.5 15.5 44 18" stroke="url(#cycloneGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Eye of the Cyclone / Central Beacon -->
  <circle cx="32" cy="32" r="3.5" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5"/>
</svg>
